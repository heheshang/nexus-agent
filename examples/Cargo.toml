[workspace]
resolver = "3"
members = [
    "demo-cancel-typestate",
    "demo-event-payload",
    "demo-error-model",
    "demo-backpressure",
    "demo-canonical-json",
    "demo-sql-guard",
    "demo-sse-frames",
    "demo-rmcp-boundary",
    "demo-consumer-trait",
    "demo-stream-fallback",
    "demo-lease-fencing",
]

# 独立于主 workspace —— 理由见 README.md。
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
bytes = "1.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring", "json", "uuid", "macros"] }
sqlparser = "0.58.0"
rmcp = { version = "3.8.0", features = [
    "server",
    "client",
    "macros",
    "server-side-http",
    "transport-io",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
await_holding_lock = "warn"

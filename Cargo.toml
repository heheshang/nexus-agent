[workspace]
resolver = "3"
members = [
    "crates/nexus-core",
    "crates/nexus-config",
    "crates/nexus-model",
    "crates/nexus-observability",
    "crates/nexus-infra",
    "crates/nexus-security",
    "crates/nexus-vector",
    "crates/nexus-llm",
    "crates/nexus-tool",
    "crates/nexus-rag",
    "crates/nexus-ingestion",
    "crates/nexus-capacity",
    "crates/nexus-workflow",
    "crates/nexus-execution",
    "crates/nexus-repo",
    "crates/nexus-agent",
    "crates/nexus-memory",
    "crates/nexus-mcp",
    "crates/nexus-a2a",
    "crates/nexus-service",
    "crates/nexus-api",
    "crates/nexus-cli",
]

# examples/ 是**独立 workspace**（有自己的 Cargo.lock）。
# 理由见 examples/README.md —— demo 的依赖组合与生产代码不同，
# 不应污染主 workspace 的依赖锁定与 lint。
exclude = ["examples"]

# 统一锁定依赖版本：所有 crate 只能通过 workspace.dependencies 引用，
# 禁止在成员 crate 里写具体的版本号（CI 用 cargo-deny 校验）。
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# ---- 内部 crate ----
nexus-core = { path = "crates/nexus-core" }
nexus-config = { path = "crates/nexus-config" }
nexus-model = { path = "crates/nexus-model" }
nexus-observability = { path = "crates/nexus-observability" }
nexus-infra = { path = "crates/nexus-infra" }
nexus-security = { path = "crates/nexus-security" }
nexus-vector = { path = "crates/nexus-vector" }
nexus-llm = { path = "crates/nexus-llm" }
nexus-tool = { path = "crates/nexus-tool" }
nexus-rag = { path = "crates/nexus-rag" }
nexus-ingestion = { path = "crates/nexus-ingestion" }
nexus-capacity = { path = "crates/nexus-capacity" }
nexus-workflow = { path = "crates/nexus-workflow" }
nexus-execution = { path = "crates/nexus-execution" }
nexus-repo = { path = "crates/nexus-repo" }
nexus-agent = { path = "crates/nexus-agent" }
nexus-memory = { path = "crates/nexus-memory" }
nexus-mcp = { path = "crates/nexus-mcp" }
nexus-a2a = { path = "crates/nexus-a2a" }
nexus-service = { path = "crates/nexus-service" }
nexus-api = { path = "crates/nexus-api" }

# ---- 运行时 ----
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
async-trait = "0.1.92"
futures = "0.3.34"
async-stream = "0.3.6"
bytes = "1.11.1"

# ---- Web / HTTP ----
axum = { version = "0.8.9", features = ["http2", "macros", "multipart", "ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit", "timeout"] }
hyper = { version = "1.8.1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "server", "http1", "tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
eventsource-stream = "0.2.3"
mime = "0.3.17"

# ---- 序列化 ----
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
toml = "1.2.0"
base64 = "0.23.1"

# ---- 数据库 ----
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "postgres", "runtime-tokio", "tls-rustls-ring", "json", "uuid", "migrate", "macros"] }
redis = { version = "2.0.0-rc.2", features = ["tokio-comp", "connection-manager", "script"] }
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1"] }

# ---- 观测 ----
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33.1", features = ["http", "trace", "grpc-tonic"] }
opentelemetry-semantic-conventions = "0.33.1"
prometheus = "0.14.0"

# ---- 错误 ----
thiserror = "2.0.21"
anyhow = "1.0.104"

# ---- 安全 ----
aes-gcm = { version = "0.11.1", features = ["aes", "alloc", "getrandom"] }
sha2 = "0.10.9"
hkdf = "0.12.4"
hmac = "0.12.1"
jsonwebtoken = "11.1.0"
rand = "0.10.3"
secrecy = { version = "0.10.3", features = ["serde"] }
zeroize = "1.8.2"
regex = "1.12.2"

# ---- 工具 / 通用 ----
clap = { version = "4.6.7", features = ["derive", "env"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
url = "2.5.7"
urlencoding = "2.1.3"
dotenvy = "0.15.7"
config = { version = "0.15.27", default-features = false, features = ["yaml"] }
dashmap = "7.0.0-rc2"
num_cpus = "1.17.0"
hex = "0.4.3"
percent-encoding = "2.3.2"

# ---- 外部协议 / 基础设施 ----
milvus-sdk = { package = "milvus-sdk-rust", version = "3.0.3" }
rmcp = { version = "3.8.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
bollard = "0.21.1"
object_store = { version = "0.14.2", features = ["aws"] }
pdf-extract = "0.12.1"
jsonschema = { version = "0.60.2", default-features = false }
evalexpr = "13.1.0"

# ---- 测试 ----
tokio-test = "0.4.4"
tempfile = "3.24.0"
# 负向测试：断言「写错的代码编译不过」（架构文档 §5.2）
trybuild = "1.0.116"

# ---- 构建期（集中管理，便于统一升级） ----
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# 异步代码里持有锁跨越 await 是致命错误（std::sync::MutexGuard 不能跨 await）
await_holding_lock = "warn"
# 未完成的实现必须有显式标记
todo = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
# 必须保留 unwind：panic 隔离（工具执行）依赖 catch_unwind / JoinError::is_panic，
# 改成 abort 会让整个进程被 panic 带走。架构文档未单列该条款，
# 依据是「工具执行需进程内隔离」这一设计意图。
panic = "unwind"
strip = "symbols"

apiVersion: ai-sdlc.io/v1alpha1
kind: AgentRole
metadata:
  name: coding-agent
spec:
  role: coding-agent
  goal: Implement backlog tasks under human review
  backstory: >-
    You are an AI coding agent. You work under strict constraints and every
    change requires review.
  tools:
    - code-editor
    - terminal
    - test-runner
  constraints:
    maxFilesPerChange: 15

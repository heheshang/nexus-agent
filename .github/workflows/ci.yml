name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 依赖缓存目录
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 工具链版本由仓库根的 rust-toolchain.toml 唯一决定 —— 不在这里覆盖。
      #
      # 为什么重要：`trybuild` 的 `.stderr` 快照是**编译器实际输出**的逐字记录，
      # 编译器版本一变，11 个负向快照全部失效。版本漂移会变成「与本次改动无关」
      # 的 CI 红灯。rustup 会自动安装 rust-toolchain.toml 指定的版本及其
      # components（rustfmt / clippy）。
      - name: 显示工具链版本
        run: rustc --version && cargo fmt --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Cargo.lock 必须入库并与 manifest 同步。
      # 一旦有人手动改了版本号却没更新 lock，CI 立刻失败。
      - name: 校验依赖锁定纪律
        run: bash scripts/check-lock.sh

      # crate 依赖方向铁律（架构文档 §0.3）
      - name: 校验 crate 依赖方向
        run: bash scripts/check-deps.sh

      # 标识符不得含中文（.cursor/rules/rust-code-standards.mdc §11）
      - name: 校验标识符命名
        run: bash scripts/check-naming.sh

      # backlog 组织纪律：任务不得同时存在于 tasks/ 与 completed/
      # （`git mv` 后编辑器可能在旧路径重建同名文件 —— 见 NEX-7 的教训）
      - name: 校验 backlog 组织纪律
        run: bash scripts/check-backlog.sh

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

  build:
    name: release build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # 工具链版本由 rust-toolchain.toml 决定（见 check 作业的说明）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: nexus-binary
          path: target/release/nexus

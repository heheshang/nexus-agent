name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 依赖缓存目录
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    # 集成测试需要真实 PostgreSQL。
    #
    # ⚠️ 没有这一步，集成测试会**全部跳过**（判据是 DATABASE_URL 是否存在）——
    # 「集成测试绿」就成了假象：CI 显示绿，但一条数据库测试都没跑。
    #
    # 版本必须是 17 —— 参考实现的迁移在 PostgreSQL 17 上干净应用。
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        # 健康检查 —— 容器起来不等于 PG 已能接受连接。
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://nexus:nexus@127.0.0.1:5432/nexus_test

    steps:
      - uses: actions/checkout@v4

      # 工具链版本由仓库根的 rust-toolchain.toml 唯一决定 —— 不在这里覆盖。
      #
      # 为什么重要：`trybuild` 的 `.stderr` 快照是**编译器实际输出**的逐字记录，
      # 编译器版本一变，11 个负向快照全部失效。版本漂移会变成「与本次改动无关」
      # 的 CI 红灯。rustup 会自动安装 rust-toolchain.toml 指定的版本及其
      # components（rustfmt / clippy）。
      - name: 显示工具链版本
        run: rustc --version && cargo fmt --version && cargo clippy --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # ⚠️ 这一步是 **AC #14 的实质内容**，不是可选的优化。
      #
      # `postgres:17` 服务起的是**空库** —— 镜像只创建数据库，**不建任何表**。
      # 而集成测试直接操作 `public` schema 的表 —— 空库上跑必然全红。
      #
      # 用 Rust 二进制（而不是 `psql` 依次跑 `.up.sql`）的原因：
      # 迁移器已通过 `sqlx::migrate!` 嵌入二进制，版本记账（`_sqlx_migrations`）
      # 由 sqlx 负责，**幂等**；走 psql 会绕过记账，迁移会被重复应用。
      #
      # 顺带断言 Phase 0 的表齐了 —— 「迁移跑完了」与「表建对了」是两件事，
      # sqlx 会**静默忽略**文件名格式不符的迁移文件。
      - name: 应用数据库迁移
        run: cargo run --locked -p nexus-infra --bin apply-migrations

      # Cargo.lock 必须入库并与 manifest 同步。
      # 一旦有人手动改了版本号却没更新 lock，CI 立刻失败。
      - name: 校验依赖锁定纪律
        run: bash scripts/check-lock.sh

      # crate 依赖方向铁律（架构文档 §0.3）
      - name: 校验 crate 依赖方向
        run: bash scripts/check-deps.sh

      # 标识符不得含中文（.cursor/rules/rust-code-standards.mdc §11）
      - name: 校验标识符命名
        run: bash scripts/check-naming.sh

      # backlog 组织纪律：任务不得同时存在于 tasks/ 与 completed/
      # （`git mv` 后编辑器可能在旧路径重建同名文件 —— 见 NEX-7 的教训）
      - name: 校验 backlog 组织纪律
        run: bash scripts/check-backlog.sh

      # Spec 层（Tier 2）组织纪律：spec.md + tasks.md + contracts/ 三件套齐全、
      # tasks.md ↔ backlog 双向对应、契约引用的测试必须真实存在、
      # 错误码白名单与 nexus-core 实际码值一致。
      - name: 校验 Spec 层组织纪律
        run: bash scripts/check-specs.sh

      # 规则文件一致性：frontmatter 合法、规则引用的仓库路径真实存在、
      # AGENTS.md 规则清单与 .cursor/rules/ 实际文件一一对应。
      #
      # 为什么必须 CI 强制：规则文件是**唯一的过程载体** ——
      # 规则里引用一个不存在的脚本，等于给出一条无法执行的判据。
      # 而「无法执行的判据」比「没有判据」更危险：它看起来是覆盖了的。
      - name: 校验规则文件一致性
        run: bash scripts/check-rules.sh

      # 文档层一致性：docs/ 内的相对链接可解析、docs/README.md 索引覆盖全部文档、
      # 覆盖矩阵引用的仓库路径存在。
      #
      # 为什么必须 CI 强制：**指向具体产物的引用必须被机器校验存在性。**
      # 规则文件引用了不存在的脚本，会给出一条无法执行的判据；
      # 文档索引列了不存在的文档，读者会以为读过它了。
      # 两者都是「看起来覆盖了，实际没有」的静默失效。
      - name: 校验文档层一致性
        run: bash scripts/check-docs.sh

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked 2>&1 | tee /tmp/test-output.txt

      # ⚠️ 这一步验证 **AC #14 的后半句**：集成测试在 CI 里**真的跑**了。
      #
      # 「跳过」的测试在 `cargo test` 摘要里显示为 `passed` ——
      # 所以「CI 全绿」**不能**证明「集成测试跑了」。
      #
      # 判据：从上一步的输出里找出每个**集成测试二进制**的
      # `test result: ok. N passed`，断言 N 达到预期值。
      #
      # 为什么用「解析输出」而不是「再跑一遍」：
      # 再跑一遍会重复付出编译与执行成本，而输出已经在手上了。
      #
      # 为什么逐个二进制断言而不是断言总数：
      # 总数可以被**别的** crate 的测试凑够 ——
      # 而「某个集成测试套件 0 passed」才是我们要防的那种假象。
      #
      # 为什么用 `grep -A` 而不是 awk 状态机：
      # `cargo test` 的输出里，`Running tests/xxx.rs` 与它后面的
      # `test result:` 行之间隔着「running N tests」与 N 行测试明细 ——
      # 窗口得开得够大，容易随测试数量变化而出错。
      #
      # 所以改用**更稳**的信号：`running N tests` 那一行里的 N
      # 就是该二进制的测试总数（= 通过数，因为失败会让 CI 直接红）。
      # 它紧跟在 `Running` 行后面，取值稳定。
      - name: 校验集成测试真的跑了
        run: |
          set -euo pipefail

          check_suite() {
            local suite="$1" min="$2"
            local actual
            actual=$(grep -A 3 -F "$suite" /tmp/test-output.txt \
              | grep -m 1 -oE 'running [0-9]+ tests' \
              | grep -oE '[0-9]+' || true)

            if [ -z "$actual" ]; then
              echo "✗ ${suite}：找不到测试数量 —— 该套件可能根本没被编进来。"
              return 1
            fi
            if [ "$actual" -lt "$min" ]; then
              echo "✗ ${suite}：只编入了 ${actual} 个测试（期望至少 ${min}）—— 有测试被跳过或没被编进来。"
              return 1
            fi
            echo "✓ ${suite}：${actual} 个测试。"
            return 0
          }

          failed=0
          check_suite "tests/migration.rs"            7  || failed=1
          check_suite "tests/lease_fencing.rs"       14  || failed=1
          check_suite "tests/outbox_idempotency.rs"  10  || failed=1
          check_suite "tests/schema_conformance.rs"    3  || failed=1
          check_suite "tests/users_repository.rs"      9  || failed=1
          check_suite "tests/sessions_repository.rs"   7  || failed=1

          if [ "$failed" -ne 0 ]; then
            echo "集成测试存在被跳过的情况 —— 「集成测试绿」是假象。"
            exit 1
          fi

  build:
    name: release build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      # 工具链版本由 rust-toolchain.toml 决定（见 check 作业的说明）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: 上传二进制
        uses: actions/upload-artifact@v4
        with:
          name: nexus-binary
          path: target/release/nexus
